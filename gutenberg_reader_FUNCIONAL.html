<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gutenberg Reader & Library</title>
<style>
*{box-sizing:border-box}
body{font-family:Georgia,serif;margin:0;background:#fcfcf9;color:#2b2b2b;display:flex;height:100vh;overflow:hidden}
#sidebar{width:320px;min-width:320px;background:#f0efe9;border-right:1px solid #ddd;display:flex;flex-direction:column}
.sidebar-header{padding:15px;border-bottom:1px solid #ccc;background:#e5e3dc}
.sidebar-header h2{margin:0 0 10px;font-size:1.2rem}
#catalog-search{width:100%;padding:9px;border:1px solid #ccc;border-radius:5px}
#book-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#book-list li{padding:10px 15px;border-bottom:1px solid #e0dfd5;cursor:pointer}
#book-list li:hover{background:#e2e0d5}
#book-list li.active{background:#d4d0bf;font-weight:bold}
.book-title{display:block;font-size:.95rem;color:#111}
.book-author{display:block;font-size:.8rem;color:#666}
#main-content{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
header{padding:15px 20px;border-bottom:2px solid #ddd;background:#fafaf7;display:flex;justify-content:space-between;align-items:center;gap:15px}
.direct-input{display:flex;gap:8px}
input[type=number],button{padding:8px 10px;font-size:.9rem}
button{cursor:pointer;border:1px solid #aaa;border-radius:4px;background:#e5e3dc}
button:hover{background:#d4d0bf}
#reader-container{flex:1;position:relative;overflow:hidden;background:white}
#status{padding:20px}
.loading{color:#555;font-style:italic}
.error{color:#b00000;font-weight:bold;padding:20px}
#book-frame{width:100%;height:100%;border:0;display:none;background:#fff}
#open-direct{display:none;margin:0 20px 15px}
#open-direct a{color:#315b9b}
@media(max-width:700px){
 body{flex-direction:column}
 #sidebar{width:100%;min-width:0;height:40%;border-right:0;border-bottom:1px solid #ddd}
 #main-content{height:60%}
 header{flex-direction:column;align-items:stretch}
 .direct-input{width:100%}
 #book-id{flex:1}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <h2>📚 Popular Catalog</h2>
    <input id="catalog-search" type="text" placeholder="Buscar por título, autor o ID...">
  </div>
  <ul id="book-list"></ul>
</aside>

<div id="main-content">
  <header>
    <h1 style="margin:0;font-size:1.4rem">Project Gutenberg Reader</h1>
    <form id="search-form" class="direct-input">
      <input id="book-id" type="number" min="1" placeholder="ID (ej. 2701)" required>
      <button type="submit">Leer libro</button>
    </form>
  </header>

  <main id="reader-container">
    <div id="status"></div>
    <div id="open-direct"></div>
    <iframe id="book-frame" title="Libro de Project Gutenberg"></iframe>
  </main>
</div>

<script>
const TOP_BOOKS = [
 {id:1342,title:"Pride and Prejudice",author:"Jane Austen"},
 {id:84,title:"Frankenstein",author:"Mary Wollstonecraft Shelley"},
 {id:11,title:"Alice's Adventures in Wonderland",author:"Lewis Carroll"},
 {id:2701,title:"Moby Dick; Or, The Whale",author:"Herman Melville"},
 {id:1661,title:"The Adventures of Sherlock Holmes",author:"Arthur Conan Doyle"},
 {id:98,title:"A Tale of Two Cities",author:"Charles Dickens"},
 {id:345,title:"Dracula",author:"Bram Stoker"},
 {id:74,title:"The Adventures of Tom Sawyer",author:"Mark Twain"},
 {id:43,title:"The Strange Case of Dr. Jekyll and Mr. Hyde",author:"Robert Louis Stevenson"},
 {id:120,title:"Treasure Island",author:"Robert Louis Stevenson"},
 {id:2591,title:"Grimms' Fairy Tales",author:"Jacob Grimm & Wilhelm Grimm"},
 {id:100,title:"The Complete Works of William Shakespeare",author:"William Shakespeare"},
 {id:1952,title:"The Yellow Wallpaper",author:"Charlotte Perkins Gilman"},
 {id:1400,title:"Great Expectations",author:"Charles Dickens"},
 {id:200,title:"The Count of Monte Cristo",author:"Alexandre Dumas"},
 {id:174,title:"The Picture of Dorian Gray",author:"Oscar Wilde"},
 {id:76,title:"Adventures of Huckleberry Finn",author:"Mark Twain"},
 {id:5200,title:"Metamorphosis",author:"Franz Kafka"},
 {id:2600,title:"War and Peace",author:"Leo Tolstoy"},
 {id:844,title:"The Importance of Being Earnest",author:"Oscar Wilde"},
 {id:135,title:"Les Misérables",author:"Victor Hugo"},
 {id:2852,title:"The Hound of the Baskervilles",author:"Arthur Conan Doyle"},
 {id:16,title:"Peter Pan",author:"J. M. Barrie"},
 {id:46,title:"A Christmas Carol in Prose",author:"Charles Dickens"},
 {id:1260,title:"Jane Eyre: An Autobiography",author:"Charlotte Brontë"},
 {id:730,title:"Oliver Twist",author:"Charles Dickens"}
];

let catalog=[...TOP_BOOKS];

const statusEl=document.getElementById("status");
const frameEl=document.getElementById("book-frame");
const inputEl=document.getElementById("book-id");
const listEl=document.getElementById("book-list");
const searchInput=document.getElementById("catalog-search");
const directEl=document.getElementById("open-direct");

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[c]));
}

function gutenbergPageUrl(id){
 return `https://www.gutenberg.org/ebooks/${id}`;
}

function setBookUrl(id){
 const url=`${window.location.pathname}?id=${encodeURIComponent(id)}`;
 window.history.pushState({}, "", url);
}

function renderCatalog(books){
 listEl.innerHTML="";
 books.forEach(book=>{
  const li=document.createElement("li");
  li.dataset.id=book.id;
  li.innerHTML=`
   <span class="book-title">${escapeHtml(book.title)}</span>
   <span class="book-author">${escapeHtml(book.author)} (#${book.id})</span>`;
  li.addEventListener("click",()=>openBook(book.id));
  listEl.appendChild(li);
 });
 highlightActiveBook();
}

function highlightActiveBook(){
 const id=new URLSearchParams(location.search).get("id");
 document.querySelectorAll("#book-list li").forEach(li=>{
  li.classList.toggle("active",li.dataset.id===id);
 });
}

searchInput.addEventListener("input",e=>{
 const q=e.target.value.toLowerCase().trim();
 renderCatalog(catalog.filter(b=>
  b.title.toLowerCase().includes(q) ||
  b.author.toLowerCase().includes(q) ||
  String(b.id).includes(q)
 ));
});

document.getElementById("search-form").addEventListener("submit",e=>{
 e.preventDefault();
 const id=inputEl.value.trim();
 if(id) openBook(id);
});

/* Get the real available formats from Gutendex. */
async function getBookMetadata(id){
 const response=await fetch(
   `https://gutendex.com/books/${encodeURIComponent(id)}`,
   {cache:"no-store"}
 );
 if(!response.ok) throw new Error(`No se encontró el libro #${id}.`);
 return response.json();
}

function chooseHtmlFormat(formats){
 const entries=Object.entries(formats||{});

 /* Prefer the normal HTML book with images. */
 const preferred=[
   "text/html; charset=utf-8",
   "text/html",
   "application/xhtml+xml"
 ];

 for(const mime of preferred){
  const found=entries.find(([key,url])=>
   key.toLowerCase()===mime.toLowerCase() && url
  );
  if(found) return {mime:found[0],url:found[1]};
 }

 return entries
   .filter(([key,url])=>
     key.toLowerCase().startsWith("text/html") && url
   )
   .map(([mime,url])=>({mime,url}))[0] || null;
}

/*
 * The old version put Gutenberg directly inside an iframe.
 * Browsers can refuse that cross-origin framing, leaving the page
 * permanently on "Abriendo...".
 *
 * This version downloads the HTML through CORS fallbacks and then
 * places the resulting document into iframe.srcdoc.
 */
async function fetchBookHtml(url){
 const encoded=encodeURIComponent(url);

 const attempts=[
   {
     name:"Gutenberg directo",
     url:url
   },
   {
     name:"AllOrigins",
     url:`https://api.allorigins.win/raw?url=${encoded}`
   },
   {
     name:"CORS Proxy",
     url:`https://corsproxy.io/?url=${encoded}`
   }
 ];

 let lastError=null;

 for(const attempt of attempts){
  try{
   statusEl.textContent=`Cargando libro… (${attempt.name})`;

   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),12000);

   const response=await fetch(attempt.url,{
     signal:controller.signal,
     cache:"no-store"
   });

   clearTimeout(timer);

   if(!response.ok){
    throw new Error(`HTTP ${response.status}`);
   }

   const text=await response.text();

   if(!text || text.length<500){
    throw new Error("Respuesta vacía o incompleta.");
   }

   /*
    * A proxy can sometimes return an error page instead of the book.
    */
   if(
     text.includes("Access Denied") &&
     text.length<10000
   ){
    throw new Error("Acceso denegado.");
   }

   return {
    html:text,
    source:attempt.name
   };

  }catch(error){
   lastError=error;
  }
 }

 throw lastError || new Error("No fue posible descargar el HTML.");
}

/*
 * Clean the downloaded document before putting it into srcdoc.
 * We remove active elements that are not needed for a book.
 */
function prepareBookHtml(rawHtml,baseUrl){
 const parser=new DOMParser();
 const doc=parser.parseFromString(rawHtml,"text/html");

 doc
   .querySelectorAll(
     "script,noscript,iframe,frame,frameset,object,embed,form,base"
   )
   .forEach(el=>el.remove());

 const head=doc.head || doc.documentElement.insertBefore(
   document.createElement("head"),
   doc.documentElement.firstChild
 );

 const base=doc.createElement("base");
 base.href=baseUrl;
 head.prepend(base);

 const style=doc.createElement("style");
 style.textContent=`
   html{background:#fff}
   body{
     max-width:900px!important;
     margin:0 auto!important;
     padding:32px 22px 80px!important;
     background:#fff!important;
     color:#222!important;
     font-family:Georgia,serif!important;
     line-height:1.65!important;
     font-size:18px!important;
   }
   img{
     max-width:100%!important;
     height:auto!important;
   }
   a{color:#2457a6}
   h1,h2,h3,h4,h5,h6{line-height:1.25}
   pre{white-space:pre-wrap;overflow-wrap:anywhere}
   table{max-width:100%;overflow:auto}
 `;

 head.appendChild(style);

 return "<!doctype html>"+doc.documentElement.outerHTML;
}

function showReader(book,html,source,baseUrl){

 frameEl.style.display="block";

 frameEl.removeAttribute("src");
 frameEl.srcdoc=html;

 statusEl.className="";
 statusEl.innerHTML=`
   <strong>${escapeHtml(book.title)}</strong>
   <br>
   <small>
     ${escapeHtml(book.author || "Autor desconocido")}
     · Fuente: Project Gutenberg
   </small>
 `;

 directEl.style.display="block";
 directEl.innerHTML=`
   <a
     href="${escapeHtml(baseUrl)}"
     target="_blank"
     rel="noopener noreferrer"
   >
     Abrir versión original ↗
   </a>
   &nbsp; · &nbsp;
   <a
     href="${escapeHtml(gutenbergPageUrl(book.id))}"
     target="_blank"
     rel="noopener noreferrer"
   >
     Página del libro
   </a>
 `;

 /*
  * Give the iframe enough time to render, then scroll to the reader.
  */
 setTimeout(()=>{
   frameEl.scrollIntoView({
     behavior:"smooth",
     block:"start"
   });
 },100);
}

function showFallback(book,id,message,formatUrl){

 frameEl.srcdoc="";
 frameEl.removeAttribute("src");
 frameEl.style.display="none";

 statusEl.className="error";
 statusEl.innerHTML=`
   <strong>No se pudo cargar el libro dentro del lector.</strong>
   <br>
   <small>${escapeHtml(message)}</small>
 `;

 directEl.style.display="block";
 directEl.innerHTML=`
   <a
     href="${escapeHtml(formatUrl || gutenbergPageUrl(id))}"
     target="_blank"
     rel="noopener noreferrer"
   >
     📖 Abrir libro
   </a>
   &nbsp; · &nbsp;
   <a
     href="${escapeHtml(gutenbergPageUrl(id))}"
     target="_blank"
     rel="noopener noreferrer"
   >
     Ver página de Gutenberg
   </a>
 `;
}

async function loadBook(id){

 frameEl.style.display="none";
 frameEl.srcdoc="";
 frameEl.removeAttribute("src");

 directEl.style.display="none";
 directEl.innerHTML="";

 statusEl.className="loading";
 statusEl.textContent=
   `Buscando el libro #${id}...`;

 try{

  const book=await getBookMetadata(id);

  const format=chooseHtmlFormat(book.formats);

  if(!format){
   throw new Error(
     "Este libro no tiene una versión HTML disponible."
   );
  }

  /*
   * Directory/base URL for relative images and CSS.
   */
  const baseUrl=format.url.substring(
    0,
    format.url.lastIndexOf("/") + 1
  );

  statusEl.textContent=
    `Descargando "${book.title}"...`;

  const result=
    await fetchBookHtml(format.url);

  const cleanHtml=
    prepareBookHtml(
      result.html,
      baseUrl
    );

  showReader(
    book,
    cleanHtml,
    result.source,
    format.url
  );

 }catch(error){

  console.error(error);

  showFallback(
    null,
    id,
    error.message || "Error desconocido.",
    null
  );
 }
}

async function openBook(id){

 id=String(id).trim();

 if(!/^\d+$/.test(id)){
  statusEl.className="error";
  statusEl.textContent="El ID debe ser un número.";
  return;
 }

 inputEl.value=id;
 setBookUrl(id);
 highlightActiveBook();

 await loadBook(id);
}

/* Load popular books from Gutendex for the sidebar. */
async function fetchPopularCatalog(){

 try{

  let all=[...TOP_BOOKS];

  for(let page=1;page<=5;page++){

   const response=await fetch(
     `https://gutendex.com/books/?sort=popular&page=${page}`,
     {cache:"no-store"}
   );

   if(!response.ok) break;

   const data=await response.json();

   if(!Array.isArray(data.results)) break;

   all.push(
     ...data.results.map(book=>({
       id:book.id,
       title:book.title || "Título desconocido",
       author:book.authors?.length
         ? book.authors.map(a=>a.name).join(", ")
         : "Autor desconocido"
     }))
   );
  }

  const unique=new Map();

  all.forEach(book=>{
   unique.set(book.id,book);
  });

  catalog=Array.from(unique.values());

  renderCatalog(catalog);

 }catch(error){

  console.warn(
    "No se pudo actualizar el catálogo:",
    error
  );

  renderCatalog(catalog);
 }
}

window.addEventListener("popstate",()=>{
 const id=new URLSearchParams(
   location.search
 ).get("id");

 if(id){
  inputEl.value=id;
  loadBook(id);
 }else{
  frameEl.style.display="none";
  frameEl.srcdoc="";
  statusEl.className="";
  statusEl.innerHTML=
    "<p>Selecciona un libro para comenzar a leer.</p>";
 }

 highlightActiveBook();
});

renderCatalog(catalog);
fetchPopularCatalog();

const initialId=new URLSearchParams(
 location.search
).get("id");

if(initialId){

 inputEl.value=initialId;
 loadBook(initialId);

}else{

 statusEl.innerHTML=`
   <p>
     📚 Selecciona un libro del catálogo o
     introduce un ID de Project Gutenberg.
   </p>
 `;

}
</script>

</body>
</html>
