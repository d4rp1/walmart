<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gutenberg Reader & Library</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Georgia, serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #fcfcf9;
            color: #2b2b2b;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background: #f0efe9;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #ccc;
            background: #e5e3dc;
        }
        .sidebar-header h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        #catalog-search {
            width: 100%;
            padding: 8px;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #book-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            flex: 1;
        }
        #book-list li {
            padding: 10px 15px;
            border-bottom: 1px solid #e0dfd5;
            cursor: pointer;
            transition: background 0.2s;
        }
        #book-list li:hover {
            background: #e2e0d5;
        }
        #book-list li.active {
            background: #d4d0bf;
            font-weight: bold;
        }
        .book-title {
            display: block;
            font-size: 0.95rem;
            color: #111;
        }
        .book-author {
            display: block;
            font-size: 0.8rem;
            color: #666;
        }
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        header {
            padding: 15px 20px;
            border-bottom: 2px solid #ddd;
            background: #fafaf7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .direct-input {
            display: flex;
            gap: 8px;
        }
        input[type="number"], button {
            padding: 6px 10px;
            font-size: 0.9rem;
        }
        #reader-container {
            padding: 20px 40px;
            overflow-y: auto;
            flex: 1;
        }
        #content {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .error { color: #c00; font-weight: bold; }
        .loading { color: #555; font-style: italic; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>Popular Catalog</h2>
            <input type="text" id="catalog-search" placeholder="Filter top books by title/author...">
        </div>
        <ul id="book-list"></ul>
    </aside>

    <div id="main-content">
        <header>
            <h1 style="margin: 0; font-size: 1.4rem;">Project Gutenberg Reader</h1>
            <form id="search-form" class="direct-input">
                <input type="number" id="book-id" placeholder="Enter ID (e.g. 1342)" required>
                <button type="submit">Read ID</button>
            </form>
        </header>

        <main id="reader-container">
            <div id="status"></div>
            <pre id="content"></pre>
        </main>
    </div>

    <script>
        // Curated base database of top Gutenberg classics
        const TOP_BOOKS = [
            { id: 1342, title: "Pride and Prejudice", author: "Jane Austen" },
            { id: 84, title: "Frankenstein", author: "Mary Wollstonecraft Shelley" },
            { id: 11, title: "Alice's Adventures in Wonderland", author: "Lewis Carroll" },
            { id: 2701, title: "Moby Dick; Or, The Whale", author: "Herman Melville" },
            { id: 1661, title: "The Adventures of Sherlock Holmes", author: "Arthur Conan Doyle" },
            { id: 98, title: "A Tale of Two Cities", author: "Charles Dickens" },
            { id: 345, title: "Dracula", author: "Bram Stoker" },
            { id: 74, title: "The Adventures of Tom Sawyer", author: "Mark Twain" },
            { id: 43, title: "The Strange Case of Dr. Jekyll and Mr. Hyde", author: "Robert Louis Stevenson" },
            { id: 120, title: "Treasure Island", author: "Robert Louis Stevenson" },
            { id: 2591, title: "Grimms' Fairy Tales", author: "Jacob Grimm & Wilhelm Grimm" },
            { id: 100, title: "The Complete Works of William Shakespeare", author: "William Shakespeare" },
            { id: 1952, title: "The Yellow Wallpaper", author: "Charlotte Perkins Gilman" },
            { id: 1400, title: "Great Expectations", author: "Charles Dickens" },
            { id: 200, title: "The Count of Monte Cristo", author: "Alexandre Dumas" },
            { id: 174, title: "The Picture of Dorian Gray", author: "Oscar Wilde" },
            { id: 1184, title: "The Count of Monte Cristo (Vol. 2)", author: "Alexandre Dumas" },
            { id: 76, title: "Adventures of Huckleberry Finn", author: "Mark Twain" },
            { id: 5200, title: "Metamorphosis", author: "Franz Kafka" },
            { id: 2600, title: "War and Peace", author: "Leo Tolstoy" },
            { id: 1250, title: "Anthem", author: "Ayn Rand" },
            { id: 844, title: "The Importance of Being Earnest", author: "Oscar Wilde" },
            { id: 135, title: "Les Misérables", author: "Victor Hugo" },
            { id: 2852, title: "The Hound of the Baskervilles", author: "Arthur Conan Doyle" },
            { id: 16, title: "Peter Pan", author: "J. M. Barrie" },
            { id: 1232, title: "The Machiavellian Prince", author: "Niccolò Machiavelli" },
            { id: 3207, title: "Leviathan", author: "Thomas Hobbes" },
            { id: 46, title: "A Christmas Carol in Prose", author: "Charles Dickens" },
            { id: 1260, title: "Jane Eyre: An Autobiography", author: "Charlotte Brontë" },
            { id: 730, title: "Oliver Twist", author: "Charles Dickens" }
        ];

        let catalog = [...TOP_BOOKS];
        const statusEl = document.getElementById('status');
        const contentEl = document.getElementById('content');
        const inputEl = document.getElementById('book-id');
        const listEl = document.getElementById('book-list');
        const searchInput = document.getElementById('catalog-search');

        // Dynamically fetch extended popular catalog (up to 1,000 top books via Gutendex API)
        async function fetchPopularCatalog() {
            try {
                let allBooks = [...TOP_BOOKS];
                // Fetch top pages of download-sorted books from Gutendex
                for (let page = 1; page <= 5; page++) {
                    const res = await fetch(`https://gutendex.com/books/?sort=popular&page=${page}`);
                    if (!res.ok) break;
                    const data = await res.json();
                    
                    const formatted = data.results.map(b => ({
                        id: b.id,
                        title: b.title,
                        author: b.authors.map(a => a.name).join(', ') || 'Unknown Author'
                    }));
                    
                    allBooks = [...allBooks, ...formatted];
                }

                // De-duplicate array by book ID
                const uniqueMap = new Map();
                allBooks.forEach(item => uniqueMap.set(item.id, item));
                catalog = Array.from(uniqueMap.values());
                renderCatalog(catalog);
            } catch (err) {
                console.warn('Could not fetch additional catalog items, using offline default list.');
            }
        }

        function renderCatalog(books) {
            listEl.innerHTML = '';
            books.forEach(book => {
                const li = document.createElement('li');
                li.dataset.id = book.id;
                li.innerHTML = `
                    <span class="book-title">${escapeHtml(book.title)}</span>
                    <span class="book-author">${escapeHtml(book.author)} (#${book.id})</span>
                `;
                li.addEventListener('click', () => {
                    window.location.search = `?id=${book.id}`;
                });
                listEl.appendChild(li);
            });
            highlightActiveBook();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }

        function highlightActiveBook() {
            const currentId = new URLSearchParams(window.location.search).get('id');
            document.querySelectorAll('#book-list li').forEach(li => {
                li.classList.toggle('active', li.dataset.id === currentId);
            });
        }

        // Search/Filter catalog locally
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = catalog.filter(b => 
                b.title.toLowerCase().includes(query) || 
                b.author.toLowerCase().includes(query) ||
                b.id.toString().includes(query)
            );
            renderCatalog(filtered);
        });

        // Search submit form
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = inputEl.value.trim();
            if (id) {
                window.location.search = `?id=${id}`;
            }
        });

        // Load content based on URL query
        async function loadBook(id) {
            statusEl.className = 'loading';
            statusEl.textContent = `Fetching Project Gutenberg Book #${id}...`;
            contentEl.textContent = '';

            const gutenbergUrl = `https://www.gutenberg.org/cache/epub/${id}/pg${id}.txt`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(gutenbergUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Unable to retrieve book text.`);
                }
                const text = await response.text();
                statusEl.textContent = '';
                contentEl.textContent = text;
            } catch (err) {
                statusEl.className = 'error';
                statusEl.innerHTML = `Failed to load book ID #${id}. Verify that the ID exists on Project Gutenberg.<br><small>${err.message}</small>`;
            }
        }

        // Initialization
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get('id');

        renderCatalog(catalog);
        fetchPopularCatalog();

        if (bookId) {
            inputEl.value = bookId;
            loadBook(bookId);
        } else {
            statusEl.innerHTML = '<p>Select a book from the popular catalog on the left or enter a Gutenberg ID above to start reading.</p>';
        }
    </script>
</body>
</html>
