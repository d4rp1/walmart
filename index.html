<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mensajes Supabase</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    .mensaje {
      margin-bottom: 10px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="output">Cargando mensajes...</div>

  <script>
    async function cargarMensajes() {
      try {
        const response = await fetch(
          "https://sgeftefyyfwxmirrdvxg.supabase.co/rest/v1/chat_messages?select=%2A&order=created_at.desc",
          {
            headers: {
              apikey: "sb_publishable_ERHDxtOTf2g6ccdEmwiuZw_SkSZ8ZAT",
              Authorization: "Bearer sb_publishable_ERHDxtOTf2g6ccdEmwiuZw_SkSZ8ZAT"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Error en la petición: " + response.statusText);
        }

        const data = await response.json();
        const contenedor = document.getElementById("output");
        contenedor.innerHTML = "";

        data.forEach(msg => {
          const div = document.createElement("div");
          div.className = "mensaje";
          // Ajusta el campo según tu tabla (ej: msg.content, msg.text, etc.)
          div.textContent = msg.content || JSON.stringify(msg);
          contenedor.appendChild(div);
        });
      } catch (err) {
        document.getElementById("output").textContent = "Error al cargar los mensajes:\n" + err;
      }
    }

    cargarMensajes();
  </script>
</body>
</html>
