<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mensajes Supabase</title>
  <style>
    body {
      font-family: sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="output">Cargando mensajes...</div>

  <script>
    async function cargarMensajes() {
      try {
        const response = await fetch(
          "https://sgeftefyyfwxmirrdvxg.supabase.co/rest/v1/chat_messages?select=%2A&order=created_at.desc",
          {
            headers: {
              apikey: "sb_publishable_ERHDxtOTf2g6ccdEmwiuZw_SkSZ8ZAT",
              Authorization: "Bearer sb_publishable_ERHDxtOTf2g6ccdEmwiuZw_SkSZ8ZAT"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Error en la petición: " + response.statusText);
        }

        const data = await response.json();
        document.getElementById("output").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("output").textContent = "Error al cargar los mensajes:\n" + err;
      }
    }

    cargarMensajes();
  </script>
</body>
</html>
