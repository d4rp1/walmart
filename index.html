<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat experimental</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chat {
  width: 100%;
  max-width: 650px;
  height: 90vh;
  background: #1f2937;
  display: flex;
  flex-direction: column;
  border-radius: 15px;
  overflow: hidden;
}

.header {
  background: #2563eb;
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
}

.status {
  font-size: 12px;
  font-weight: normal;
  margin-top: 5px;
  opacity: 0.8;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.message {
  background: #374151;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 10px;
  width: fit-content;
  max-width: 85%;
}

.name {
  color: #60a5fa;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 4px;
}

.time {
  color: #9ca3af;
  font-size: 10px;
  margin-top: 5px;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #111827;
}

input {
  border: none;
  outline: none;
  border-radius: 8px;
  padding: 12px;
}

#name {
  width: 120px;
}

#message {
  flex: 1;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

@media (max-width: 600px) {
  .chat {
    height: 100vh;
    border-radius: 0;
  }

  #name {
    width: 90px;
  }
}
</style>

</head>

<body>

<div class="chat">

  <div class="header">
    💬 Chat experimental
    <div class="status" id="status">
      Conectando...
    </div>
  </div>

  <div id="messages"></div>

  <div class="input-area">

```
<input
  id="name"
  placeholder="Nombre"
  maxlength="30"
>

<input
  id="message"
  placeholder="Escribe un mensaje..."
  maxlength="500"
>

<button onclick="sendMessage()">
  Enviar
</button>
```

  </div>

</div>

<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const GITHUB_USER = "TU_USUARIO";

const GITHUB_REPO = "d4rp1/walmart";

const GITHUB_TOKEN = "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";

const FILE_PATH = "chat.json";

const BRANCH = "main";

/* =====================================================
   VARIABLES
   ===================================================== */

let fileSHA = null;

let messages = [];


/* =====================================================
   URL DE LA API
   ===================================================== */

function apiURL() {

  return `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

}


/* =====================================================
   HEADERS
   ===================================================== */

function headers() {

  return {

    "Accept": "application/vnd.github+json",

    "Authorization": `Bearer ${GITHUB_TOKEN}`,

    "X-GitHub-Api-Version": "2022-11-28"

  };

}


/* =====================================================
   LEER CHAT
   ===================================================== */

async function loadChat() {

  try {

    const response = await fetch(
      apiURL() + "?t=" + Date.now(),
      {
        headers: headers()
      }
    );

    if (!response.ok) {

      throw new Error(
        "GitHub respondió " + response.status
      );

    }

    const data = await response.json();

    fileSHA = data.sha;

    const binary = atob(
      data.content.replace(/\n/g, "")
    );

    const bytes = Uint8Array.from(
      binary,
      c => c.charCodeAt(0)
    );

    const text = new TextDecoder().decode(bytes);

    messages = JSON.parse(text);

    showMessages();

    document.getElementById("status").textContent =
      "🟢 Conectado";

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "🔴 Error de conexión";

  }

}


/* =====================================================
   MOSTRAR MENSAJES
   ===================================================== */

function showMessages() {

  const container =
    document.getElementById("messages");

  container.innerHTML = "";

  messages.forEach(message => {

    const div = document.createElement("div");

    div.className = "message";

    const name =
      document.createElement("div");

    name.className = "name";

    name.textContent = message.name;

    const text =
      document.createElement("div");

    text.textContent = message.text;

    const time =
      document.createElement("div");

    time.className = "time";

    time.textContent = message.time;

    div.appendChild(name);

    div.appendChild(text);

    div.appendChild(time);

    container.appendChild(div);

  });

  container.scrollTop =
    container.scrollHeight;

}


/* =====================================================
   ENVIAR MENSAJE
   ===================================================== */

async function sendMessage() {

  const name =
    document.getElementById("name").value.trim();

  const text =
    document.getElementById("message").value.trim();

  if (!name) {

    alert("Escribe tu nombre.");

    return;

  }

  if (!text) {

    return;

  }

  const newMessage = {

    name: name,

    text: text,

    time: new Date().toLocaleString()

  };

  try {

    document.getElementById("status").textContent =
      "⏳ Enviando...";


    /*
       Primero volvemos a leer el archivo.
       Esto nos da el SHA más reciente.
    */

    await loadChat();


    messages.push(newMessage);


    const json =
      JSON.stringify(messages, null, 2);


    /*
       Convertimos UTF-8 a Base64
    */

    const bytes =
      new TextEncoder().encode(json);

    let binary = "";

    bytes.forEach(byte => {

      binary += String.fromCharCode(byte);

    });

    const base64 =
      btoa(binary);


    /*
       Actualizamos chat.json
    */

    const response = await fetch(
      apiURL(),
      {

        method: "PUT",

        headers: {

          ...headers(),

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          message:
            "Nuevo mensaje del chat",

          content:
            base64,

          sha:
            fileSHA,

          branch:
            BRANCH

        })

      }
    );


    if (!response.ok) {

      const error =
        await response.json();

      throw new Error(
        error.message || "Error de GitHub"
      );

    }


    document.getElementById("message").value = "";

    document.getElementById("status").textContent =
      "🟢 Mensaje enviado";

    await loadChat();


  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "🔴 Error al enviar";

    alert(
      "No se pudo enviar el mensaje:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   ENTER = ENVIAR
   ===================================================== */

document
  .getElementById("message")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }
  );


/* =====================================================
   ACTUALIZACIÓN AUTOMÁTICA
   ===================================================== */

setInterval(
  loadChat,
  5000
);


/* =====================================================
   INICIAR
   ===================================================== */

loadChat();

</script>

</body>
</html>
